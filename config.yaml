upstream_url: "https://api.minimaxi.com/anthropic"   # real LLM provider base URL, no trailing slash
listen_host: "192.168.1.160"
listen_port: 8899

# model_mappings: what CCH sends (key) → what the real provider expects (value)
# Models not listed here pass through unchanged.
model_mappings:
  claude-haiku-4-5: "MiniMax-M2.7-highspeed"
  claude-sonnet-4-6: "MiniMax-M2.7-highspeed"
  claude-haiku-4-5-20251001: "MiniMax-M2.7-highspeed"

