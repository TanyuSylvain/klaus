[project]
name = "llm-proxy"
version = "0.1.0"
description = "Lightweight LLM reverse proxy with model name rewriting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.41",
    "httpx[http2,socks]>=0.28",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
